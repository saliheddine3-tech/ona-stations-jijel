<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>

    <!-- Droplet Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <radialGradient id="dropHighlight" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Path for Upper Arabic Arc Text -->
    <path id="upperArc" d="M 65 250 A 185 185 0 0 1 435 250" fill="none"/>
    <!-- Path for Upper Tifinagh Arc -->
    <path id="upperTifinagh" d="M 105 250 A 145 145 0 0 1 395 250" fill="none"/>
    <!-- Path for Lower Unit Arc -->
    <path id="lowerArc" d="M 100 250 A 150 150 0 0 0 400 250" fill="none"/>
    <!-- Path for Lower Tifinagh Arc -->
    <path id="lowerTifinagh" d="M 130 250 A 120 120 0 0 0 370 250" fill="none"/>
  </defs>

  <!-- Base Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)"/>
  
  <!-- Outer Double Borders -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#1e3a5f" stroke-width="5.5"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#65a30d" stroke-width="1.8" stroke-dasharray="8 4"/>
  <circle cx="250" cy="250" r="162" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <circle cx="250" cy="250" r="154" fill="none" stroke="#65a30d" stroke-width="1.5"/>

  <!-- Upper Arabic Arc Text: الديوان الوطني للتطهير -->
  <text font-family="'Cairo', sans-serif" font-size="34" font-weight="900" fill="#1e3a5f" letter-spacing="2">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
      الـديـوان الـوطـنـي لـلـتـطـهـيـر
    </textPath>
  </text>

  <!-- Side Decorative Dots -->
  <circle cx="48" cy="268" r="8" fill="#1e3a5f"/>
  <circle cx="452" cy="268" r="8" fill="#1e3a5f"/>
  <circle cx="118" cy="425" r="7" fill="#1e3a5f"/>
  <circle cx="382" cy="425" r="7" fill="#1e3a5f"/>

  <!-- Tifinagh Subtitle Arc -->
  <text font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a5f" letter-spacing="3">
    <textPath href="#upperTifinagh" startOffset="50%" text-anchor="middle">
      ° ⵜⵉⵜⴻⴷ · ⵜⵉⵜⴻⴷ | ⵜⵉⵜⴻⴷ · ⵜⵉⵜⴻⴷ °
    </textPath>
  </text>

  <!-- Center Artwork: Fluid Swooshes -->
  <!-- Left Green Swoosh -->
  <path d="M 155 235 C 160 170 195 110 240 100 C 220 120 185 165 190 230 C 180 215 165 225 155 235 Z" fill="#65a30d" opacity="0.9"/>
  <!-- Right Light Green Swoosh -->
  <path d="M 345 235 C 340 170 305 110 260 100 C 280 120 315 165 310 230 C 320 215 335 225 345 235 Z" fill="#84cc16" opacity="0.8"/>
  
  <!-- Subtle Water Ripples -->
  <path d="M 210 185 C 220 165 280 165 290 185" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 205 195 C 215 170 285 170 295 195" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Center Shaded Blue Water Droplet / Pebble -->
  <ellipse cx="265" cy="178" rx="36" ry="24" transform="rotate(-18 265 178)" fill="url(#dropGrad)"/>
  <ellipse cx="260" cy="172" rx="20" ry="11" transform="rotate(-18 260 172)" fill="url(#dropHighlight)"/>
  <ellipse cx="275" cy="184" rx="12" ry="6" fill="#0284c7" opacity="0.6"/>

  <!-- Center Titles -->
  <!-- مركز المحطات (Arabic in Bold Dark Green) -->
  <text x="250" y="278" font-family="'Cairo', sans-serif" font-size="32" font-weight="900" fill="#2d6a27" text-anchor="middle">
    مركــز المحطــات
  </text>

  <!-- Waves -->
  <path d="M 215 292 Q 225 288 235 292 T 255 292 T 275 292 T 285 292" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 215 298 Q 225 294 235 298 T 255 298 T 275 298 T 285 298" fill="none" stroke="#2d6a27" stroke-width="2" stroke-linecap="round"/>

  <!-- JIJEL -->
  <text x="250" y="324" font-family="'Cairo', sans-serif" font-size="24" font-weight="900" fill="#1e3a5f" text-anchor="middle" letter-spacing="4">
    JIJEL
  </text>

  <!-- ONA -->
  <text x="250" y="356" font-family="'Cairo', sans-serif" font-size="32" font-weight="900" fill="#65a30d" text-anchor="middle" letter-spacing="3">
    ONA
  </text>

  <!-- STATION CENTER -->
  <text x="250" y="382" font-family="'Cairo', sans-serif" font-size="18" font-weight="900" fill="#1e3a5f" text-anchor="middle" letter-spacing="2">
    STATION CENTER
  </text>

  <!-- Lower Tifinagh -->
  <text font-family="sans-serif" font-size="12" font-weight="700" fill="#1e3a5f" letter-spacing="2">
    <textPath href="#lowerTifinagh" startOffset="50%" text-anchor="middle">
      ° ⵜⵉⵜⴻⴷ · ⵜⵉⵜⴻⴷ | ⵜⵉⵜⴻⴷ · ⵜⵉⵜⴻⴷ °
    </textPath>
  </text>

  <!-- Lower Arc Text: JIJEL UNIT -->
  <text font-family="'Cairo', sans-serif" font-size="26" font-weight="900" fill="#1e3a5f" letter-spacing="3">
    <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">
      JIJEL UNIT
    </textPath>
  </text>
</svg>
